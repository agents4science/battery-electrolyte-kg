[project]
name = "electrolyte-kg-discovery"
version = "0.1.0"
description = "Agentic AI-driven Knowledge Graph discovery for battery electrolyte design"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "rdflib>=7.0.0",
    "networkx>=3.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "pykeen>=1.10.0",  # KG embeddings
    "requests>=2.31.0",
    "tqdm>=4.65.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
